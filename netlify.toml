# Configuration Netlify : le site React se trouve dans frontend/.
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 demande Node 20.19+ ou 22.12+.
  NODE_VERSION = "22"

# Application monopage : toutes les routes (/groupe, /contact…) renvoient index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
